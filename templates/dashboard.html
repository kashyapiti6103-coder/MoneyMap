{% extends "base.html" %}

{% block content %}

<div class="grid-3">

    <div class="card">
        <div class="stat-label">Total Spent</div>
        <div class="stat-value" id="totalSpent">...</div>
    </div>

    <div class="card">
        <div class="stat-label">Monthly Budget</div>
        <div class="stat-value" id="monthlyBudget">...</div>
    </div>

    <div class="card">
        <div class="stat-label">Remaining</div>
        <div class="stat-value" id="remaining">...</div>
    </div>

</div>

<div class="card">
    <h3>Recent Activity</h3>

    <!-- ✅ IMPORTANT (table responsive) -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="recentTable">
                <tr><td>Loading...</td></tr>
            </tbody>
        </table>
    </div>

</div>

{% endblock %}

{% block scripts %}
<script>loadDashboard();</script>
{% endblock %}
