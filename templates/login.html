<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MoneyMap | Login</title>

    <!-- ✅ MOST IMPORTANT -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="login-page">

<div class="login-container" id="container">

    <!-- Sign Up -->
    <div class="form-container sign-up-container">
        <form onsubmit="event.preventDefault(); signup()">
            <h1>Create Account</h1>
            <p>Register with your email</p>

            <input type="text" id="sUser" placeholder="Username" required>
            <input type="email" id="sEmail" placeholder="Email" required>
            <input type="password" id="sPass" placeholder="Password" required>

            <div id="signupMsg"></div>

            <button type="submit" class="btn">Sign Up</button>

            <!-- Mobile toggle -->
            <div class="mobile-toggle" onclick="toggleForm()">Already have an account? Sign In</div>
        </form>
    </div>

    <!-- Sign In -->
    <div class="form-container sign-in-container">
        <form onsubmit="event.preventDefault(); login()">
            <h1>Sign In</h1>
            <p>Welcome back to MoneyMap</p>

            <input type="text" id="lUser" placeholder="Username or Email" required>
            <input type="password" id="lPass" placeholder="Password" required>

            <div id="authMsg"></div>

            <button type="submit" class="btn">Sign In</button>

            <!-- Mobile toggle -->
            <div class="mobile-toggle" onclick="toggleForm()">New user? Sign Up</div>
        </form>
    </div>

    <!-- Overlay (desktop only) -->
    <div class="overlay-container">
        <div class="overlay">

            <div class="overlay-panel overlay-left">
                <h1>Welcome Back!</h1>
                <p>Login with your personal info</p>
                <button class="ghost" id="signInBtn">Sign In</button>
            </div>

            <div class="overlay-panel overlay-right">
                <h1>Hello, Friend!</h1>
                <p>Start your journey</p>
                <button class="ghost" id="signUpBtn">Sign Up</button>
            </div>

        </div>
    </div>
</div>

<div class="auth-footer">
    <p>&copy; 2026 MoneyMap</p>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

<script>
const signUpButton = document.getElementById('signUpBtn');
const signInButton = document.getElementById('signInBtn');
const container = document.getElementById('container');

if(signUpButton && signInButton){
    signUpButton.addEventListener('click', () => container.classList.add("right-panel-active"));
    signInButton.addEventListener('click', () => container.classList.remove("right-panel-active"));
}

// Mobile toggle
function toggleForm(){
    container.classList.toggle("right-panel-active");
}
</script>

</body>
</html>
